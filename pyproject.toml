[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdinsight"
version = "1.0.0"
description = "🔍 Terminal Command History Intelligent Analysis Engine - Analyze patterns, discover insights, boost productivity"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "CmdInsight Team"}
]
maintainers = [
    {name = "CmdInsight Team"}
]
keywords = [
    "cli",
    "terminal",
    "command-history",
    "analysis",
    "productivity",
    "shell",
    "bash",
    "zsh",
    "fish",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
cmdinsight = "cmdinsight.cli:cli_entry"

[project.urls]
Homepage = "https://github.com/gitstq/CmdInsight"
Documentation = "https://github.com/gitstq/CmdInsight#readme"
Repository = "https://github.com/gitstq/CmdInsight"
Issues = "https://github.com/gitstq/CmdInsight/issues"
Changelog = "https://github.com/gitstq/CmdInsight/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["cmdinsight*"]

[tool.setuptools.package-data]
cmdinsight = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
